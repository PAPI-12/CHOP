<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papi Raborife | Product Designer Portfolio</title>
    <meta name="description" content="Papi Raborife — culture-led product designer &amp; art director based in Johannesburg, South Africa. Crafting awesomeness since 2015." />
    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Match the hero's srcset AND cover-aware sizes so preload chooses the
         same photograph WebP without downloading a second candidate on mount. -->
    <link rel="preload" as="image" type="image/webp" href="/images/hero-landscape-1920.webp" imagesrcset="/images/hero-landscape-1280.webp 1280w, /images/hero-landscape-1920.webp 1920w, /images/hero-landscape-2560.webp 2559w" imagesizes="max(100vw, 142svh, 767px)" fetchpriority="high">
    <!-- The rain pane drawn over the photograph on desktop, wiped by the
         cursor. Preloaded at default priority: needed soon, but never at the
         cost of the photograph that IS the first paint. Only fetched where a
         pane will exist — phones land on the clean photograph. -->
    <link rel="preload" as="image" type="image/webp" href="/images/hero-rain-pane-1920.webp" imagesrcset="/images/hero-rain-pane-1280.webp 1280w, /images/hero-rain-pane-1920.webp 1920w" imagesizes="max(100vw, 142svh, 767px)" media="(min-width: 768px) and (pointer: fine) and (hover: hover) and (prefers-reduced-motion: no-preference)">

    <!-- Core UI fonts. Loaded async so first paint is never blocked on the network. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap">
    </noscript>

    <style>
      html { background-color: #000000; }
      body { background-color: #000000; color: #f5f3ee; margin: 0; overflow-x: clip; }
      /* Paint immediately in a metric-similar system stack; swap to Inter on load. */
      body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
